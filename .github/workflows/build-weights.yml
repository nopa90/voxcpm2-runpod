name: Build and Push VoxCPM2 Image (Weights Baked In)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "Dockerfile.weights"
      - "builder/download-weights.sh"
      - "builder/requirements.txt"
      - "src/handler.py"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (weights baked in)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.weights
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/voxcpm2-runpod:weights
          cache-from: type=gha
          cache-to: type=gha,mode=max
